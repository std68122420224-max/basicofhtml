<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Demo</title>
</head>
<body>
  <h4>ตารางคะแนนพรีเมียร์ลีก</h4>
  <table border="1">
    <thead>
      <th>อันดับ</th>
      <th>ชื่อสโมสร</th>
      <th>แต้ม</th>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>อาเซนอล</td>
        <td>28</td>
      </tr>
      <tr>
        <td>2</td>
        <td>ไบรทตัน</td>
        <td>22</td>
      </tr>
      <tr>
        <td>3</td>
        <td>แมนเชสเตอร์ ซิตี้</td>
        <td>22</td>
      </tr>
      <tr>
        <td>4</td>
        <td>ลิเวอร์พูล</td>
        <td>21</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
